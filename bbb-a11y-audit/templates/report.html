<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoria WCAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<script>
/* Tema antes do primeiro paint: escolha salva, senão o do sistema. */
(function () {
  var t = null;
  try { t = localStorage.getItem('bbb-a11y-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root {
  --bg: #F6F6F4; --surface: #FFFFFF; --surface-2: #F0F0ED; --surface-3: #E6E6E2; --line: #E3E3DE;
  --fg: #16161A; --fg-2: #45454D; --fg-3: #62626A; --accent: #1D4ED8; --focus: #1D4ED8;
  --shot: #E6E6E1; --shot-2: #D6D6D0; --mark: #D9480F; --code: #F0F0ED;
  --fail: #B42318; --fail-bg: #FCEAE8; --pass: #0A6B3B; --pass-bg: #E3F3E9; --human: #5134C4; --human-bg: #ECE8FB;
  --na: #4F4F57; --na-bg: #ECECE8; --notcov: #4F4F57; --notcov-bg: #ECECE8;
  --blocker: #8A1111; --blocker-bg: #FADEDE; --high: #A8390A; --high-bg: #FBE9DE; --medium: #7A5200; --medium-bg: #F8EED3;
  --low: #4F4F57; --low-bg: #ECECE8; --now: #1D4ED8; --now-bg: #E6ECFC; --backlog: #4F4F57; --backlog-bg: #ECECE8;
  --scrim: rgba(8, 9, 11, 0.62);
  --ease: cubic-bezier(.22, .8, .24, 1);
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0D0E10; --surface: #16181B; --surface-2: #1D2024; --surface-3: #272B30; --line: #2A2E34;
  --fg: #ECECEE; --fg-2: #BDBFC6; --fg-3: #9A9DA6; --accent: #8EB4FF; --focus: #8EB4FF;
  --shot: #1F2226; --shot-2: #2B2F35; --mark: #FF8A4C; --code: #1D2024;
  --fail: #FF9D93; --fail-bg: #3A1917; --pass: #74D69D; --pass-bg: #11301F; --human: #BBA9FF; --human-bg: #251D45;
  --na: #BDBFC6; --na-bg: #272B30; --notcov: #BDBFC6; --notcov-bg: #272B30;
  --blocker: #FF8E8E; --blocker-bg: #461616; --high: #FFAE85; --high-bg: #3B2215; --medium: #F0C566; --medium-bg: #33290F;
  --low: #BDBFC6; --low-bg: #272B30; --now: #8EB4FF; --now-bg: #1A2647; --backlog: #BDBFC6; --backlog-bg: #272B30;
  --scrim: rgba(0, 0, 0, 0.72);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; scroll-padding-top: 16px; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.55; }
h1, h2, h3, h4, h5, p, ul, ol, dl, dd, figure, pre { margin: 0; }
ul, ol { padding: 0; }
.mono, code, pre { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
[tabindex="-1"]:focus { outline: none; }
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* Troca de tema suave: só durante a troca, para não pesar o resto do tempo. */
html.theming *, html.theming *::before, html.theming *::after {
  transition: background-color .35s var(--ease), color .35s var(--ease), border-color .35s var(--ease), box-shadow .35s var(--ease), fill .35s var(--ease) !important;
}

/* ---------- Tons ---------- */
[data-tone] { --t: var(--fg-2); --t-bg: var(--surface-2); }
[data-tone=fail] { --t: var(--fail); --t-bg: var(--fail-bg); }
[data-tone=pass] { --t: var(--pass); --t-bg: var(--pass-bg); }
[data-tone=human] { --t: var(--human); --t-bg: var(--human-bg); }
[data-tone=na] { --t: var(--na); --t-bg: var(--na-bg); }
[data-tone=notcov] { --t: var(--notcov); --t-bg: var(--notcov-bg); }
[data-tone=blocker] { --t: var(--blocker); --t-bg: var(--blocker-bg); }
[data-tone=high] { --t: var(--high); --t-bg: var(--high-bg); }
[data-tone=medium] { --t: var(--medium); --t-bg: var(--medium-bg); }
[data-tone=low] { --t: var(--low); --t-bg: var(--low-bg); }
[data-tone=now] { --t: var(--now); --t-bg: var(--now-bg); }
[data-tone=backlog] { --t: var(--backlog); --t-bg: var(--backlog-bg); }

.chip, .chip-q { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; line-height: 1.5; white-space: nowrap; }
.chip { color: var(--t); background: var(--t-bg); }
.chip-q { color: var(--fg-2); background: var(--surface-2); }
.chip.sm, .chip-q.sm { font-size: 12px; padding: 1px 8px; }
.tinted { color: var(--t); }
.ico { color: var(--t); flex: none; display: inline-flex; }
.sq { width: 10px; height: 10px; border-radius: 3px; background: var(--t); flex: none; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--fg-3); }
.tnum { font-variant-numeric: tabular-nums; }
.zero { color: var(--fg-3); }
.wrap-any { overflow-wrap: anywhere; }
.pretty { text-wrap: pretty; }
.balance { text-wrap: balance; }
.muted { color: var(--fg-3); }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* ---------- Controles ---------- */
.btn, .btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color .18s var(--ease), color .18s var(--ease), opacity .18s var(--ease), transform .12s var(--ease); }
.btn { padding: 0 16px; background: var(--surface-2); color: var(--fg); }
.btn:hover { background: var(--surface-3); }
.btn-ghost { padding: 0 12px; background: transparent; color: var(--fg-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn:active, .btn-ghost:active { transform: scale(.98); }
.btn:disabled, .btn-ghost:disabled { opacity: .4; cursor: default; transform: none; background: transparent; }
.btn-ghost .theme-ic { transition: transform .45s var(--ease); }
:root[data-theme="dark"] .btn-ghost .theme-ic { transform: rotate(-35deg); }

.crumb { border: 0; background: transparent; padding: 4px 2px; color: var(--fg-3); font-size: 13.5px; cursor: pointer; border-radius: 6px; transition: color .18s var(--ease); }
.crumb:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }

.seg-wrap { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface-2); overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.seg-wrap::-webkit-scrollbar { display: none; }
.seg { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent; color: var(--fg-2); font-size: 13.5px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background-color .22s var(--ease), color .22s var(--ease), box-shadow .22s var(--ease); }
.seg:hover { color: var(--fg); }
.seg[aria-pressed=true] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line); }
.seg-n { font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; }

.nav-i { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 6px 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; cursor: pointer; color: var(--fg-2); font-size: 14px; line-height: 1.35; transition: background-color .2s var(--ease), color .2s var(--ease), box-shadow .2s var(--ease); }
.nav-i:hover { background: var(--surface-2); color: var(--fg); }
.nav-i[aria-current=page] { background: var(--surface); color: var(--fg); font-weight: 500; box-shadow: 0 0 0 1px var(--line); }
.nav-i.l2 { padding-left: 18px; }
.nav-i.l3 { padding-left: 30px; }
.nav-n { margin-left: auto; font-size: 12.5px; color: var(--fg-3); font-variant-numeric: tabular-nums; font-weight: 400; white-space: nowrap; }

.row { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; align-items: center; gap: 16px; width: 100%; padding: 13px 16px; border: 0; border-radius: 12px; background: transparent; text-align: left; cursor: pointer; transition: background-color .18s var(--ease); }
.row:hover { background: var(--surface-2); }
.row-arrow { color: var(--fg-3); flex: none; transition: transform .22s var(--ease), color .22s var(--ease); }
.row:hover .row-arrow, .row:focus-visible .row-arrow { transform: translateX(3px); color: var(--fg); }
.row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-t { font-size: 14.5px; font-weight: 500; line-height: 1.4; text-wrap: pretty; }
.row-l { font-family: var(--mono); font-size: 12px; color: var(--fg-3); overflow-wrap: anywhere; }
.row-end { display: flex; align-items: center; gap: 10px; }

.scen { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 12px 14px; border: 0; border-radius: 12px; background: var(--surface-2); color: var(--fg); text-align: left; cursor: pointer; min-width: 0; transition: background-color .22s var(--ease), color .22s var(--ease); }
.scen:hover { background: var(--surface-3); }
.scen[aria-pressed=true] { background: var(--fg); color: var(--bg); }
.scen-sub { font-size: 12.5px; color: var(--fg-3); transition: color .22s var(--ease); }
.scen[aria-pressed=true] .scen-sub { color: var(--bg); opacity: .85; }

.ref { display: inline-flex; align-items: center; min-height: 28px; padding: 0 9px; border: 0; border-radius: 8px; background: var(--surface); color: var(--accent); font-family: var(--mono); font-size: 12px; cursor: pointer; box-shadow: 0 0 0 1px var(--line); transition: background-color .18s var(--ease); }
.ref:hover { background: var(--surface-3); }

input[type=search], select.sel { font-size: 15px; color: var(--fg); background: var(--surface-2); border: 0; border-radius: 12px; min-height: 46px; width: 100%; transition: box-shadow .2s var(--ease), background-color .2s var(--ease); }
input[type=search] { padding: 0 16px 0 42px; }
input[type=search]::placeholder { color: var(--fg-3); }
input[type=search]:focus-visible, select.sel:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--focus); background: var(--surface); }
select.sel { width: auto; min-height: 40px; font-size: 13.5px; padding: 0 12px; border-radius: 10px; }

table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-weight: 500; color: var(--fg-3); font-size: 12.5px; padding: 8px 14px; white-space: nowrap; }
td { padding: 10px 14px; border-top: 1px solid var(--line); vertical-align: top; }
tbody th { font-family: var(--mono); font-size: 12.5px; color: var(--fg); font-weight: 400; white-space: nowrap; border-top: 1px solid var(--line); padding: 10px 14px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }

.skip { position: absolute; left: 16px; top: -60px; z-index: 20; padding: 10px 16px; border-radius: 10px; background: var(--fg); color: var(--bg); text-decoration: none; font-weight: 500; transition: top .2s var(--ease); }
.skip:focus { top: 12px; }

/* ---------- Blocos ---------- */
.shell { max-width: 1320px; margin: 0 auto; padding-left: clamp(16px, 3vw, 40px); padding-right: clamp(16px, 3vw, 40px); }
.card { background: var(--surface); border-radius: 18px; }
.card.pad { padding: 22px 24px; }
.card.list { padding: 8px; }
.empty { font-size: 14px; color: var(--fg-2); padding: 18px 20px; border-radius: 16px; background: var(--surface); }
.sec { display: flex; flex-direction: column; gap: 14px; }
.sec-head { display: flex; flex-direction: column; gap: 4px; }
.h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.h2-lg { font-size: 24px; font-weight: 600; letter-spacing: -0.015em; }
.lead { font-size: 14px; color: var(--fg-2); }
.grp-h { display: flex; align-items: baseline; gap: 10px; padding: 12px 16px 8px; font-size: 14.5px; font-weight: 600; }
.grp-h .mono { font-weight: 500; color: var(--fg-3); }
.grp-h .tnum { font-weight: 400; color: var(--fg-3); }
.kv { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kv dt { font-size: 12.5px; color: var(--fg-3); }
.kv dd { font-size: 14px; font-weight: 500; }
.grid-auto { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(var(--min, 300px), 100%), 1fr)); }

header.top { padding-top: 24px; display: flex; flex-direction: column; gap: 22px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--fg-2); min-width: 0; }
.meta-list { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--fg-3); }
.meta-list .v { color: var(--fg-2); }
.verdict { background: var(--surface); border-radius: 20px; padding: clamp(20px, 2.4vw, 28px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 24px 40px; align-items: center; }
.verdict-ic { width: 48px; height: 48px; border-radius: 14px; background: var(--t-bg); color: var(--t); display: grid; place-items: center; flex: none; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(132px, 100%), 1fr)); gap: 16px 12px; }
.kpis > div { display: flex; flex-direction: column-reverse; gap: 2px; }
.kpis dt { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg-3); line-height: 1.3; white-space: nowrap; }
.kpis dd { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
.bar { display: flex; gap: 3px; height: 6px; grid-column: 1 / -1; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--t); transform-origin: left; animation: grow .7s var(--ease) both; }

.body { padding-top: 28px; padding-bottom: 64px; display: flex; flex-wrap: wrap; gap: 28px 40px; align-items: flex-start; }
nav.side { flex: 1 1 260px; max-width: 100%; }
.side-toggle { display: none; }
.side-inner { display: flex; flex-direction: column; gap: 22px; }
.side-group { display: flex; flex-direction: column; gap: 4px; }
.side-group ul { list-style: none; display: flex; flex-direction: column; gap: 2px; }
main { flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 24px; }

.crit-card { background: var(--surface); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 14px; transition: box-shadow .22s var(--ease), transform .22s var(--ease); }
.crit-card:hover { box-shadow: 0 0 0 1px var(--line), 0 10px 28px -14px rgba(0,0,0,.18); }
.crit-card dl { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.crit-card dl div { display: flex; justify-content: space-between; gap: 12px; }
.crit-card dt { color: var(--fg-3); }
.crit-card dd { text-align: right; }
.crit-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto auto; align-items: center; gap: 12px 16px; }
.crit-row .row-t { font-size: 14px; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 14px 24px; background: var(--surface); border-radius: 16px; padding: 18px 20px; }
.facts .wide { grid-column: 1 / -1; }
.facts2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.facts2 .wide { grid-column: 1 / -1; }
pre.quote { font-size: 12.5px; line-height: 1.6; padding: 12px 14px; border-radius: 10px; background: var(--code); overflow-x: auto; color: var(--fg); white-space: pre-wrap; overflow-wrap: anywhere; }
.prose { white-space: pre-line; }

/* ---------- Prints ---------- */
.frame { position: relative; display: block; width: 100%; overflow: hidden; border-radius: 10px; background: var(--shot); }
.frame img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top left; }
.frame.big { border-radius: 14px; }
.frame .ph { position: absolute; inset: 0; display: grid; grid-template-columns: 18% 1fr; gap: 6%; padding: 5%; }
.frame .ph i, .frame .ph b { border-radius: 6px; background: var(--shot-2); opacity: .7; }
.frame .ph span { display: grid; grid-template-rows: 12% 1fr 14%; gap: 8%; }
.mark { position: absolute; border: 2px solid var(--mark); border-radius: 4px; background: color-mix(in srgb, var(--mark) 12%, transparent); animation: mark-in .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms + 120ms); }
.mark b { position: absolute; left: -2px; top: -22px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 6px; background: var(--mark); color: #FFFFFF; font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; }
.mark.top b { top: auto; bottom: -22px; }
.frame.big .mark b { min-width: 22px; height: 22px; line-height: 22px; font-size: 12.5px; border-radius: 7px; top: -26px; }
.frame.big .mark.top b { top: auto; bottom: -26px; }
.shot-fig { background: var(--surface); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.shot-fig.portrait .frame { max-width: 300px; margin: 0 auto; }
.shot-open { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; border-radius: 10px; }
.shot-open .frame img { transition: transform .5s var(--ease); }
.shot-open:hover .frame img { transform: scale(1.015); }
.tile .frame { aspect-ratio: 16 / 10; }
.tile .frame.portrait img { object-fit: contain; object-position: center top; }

/* ---------- Diálogo do print ---------- */
dialog.lb { border: 0; padding: 0; background: transparent; color: var(--fg); width: min(1240px, calc(100vw - 24px)); max-width: none; max-height: calc(100vh - 24px); overflow: visible; }
dialog.lb::backdrop { background: var(--scrim); opacity: 0; transition: opacity .22s var(--ease); }
dialog.lb.open::backdrop { opacity: 1; }
.lb-panel { max-height: calc(100vh - 24px); overflow: auto; background: var(--surface); border-radius: 20px; padding: clamp(16px, 2vw, 24px); display: flex; flex-direction: column; gap: 16px; opacity: 0; transform: translateY(8px) scale(.975); transition: opacity .22s var(--ease), transform .26s var(--ease); }
dialog.lb.open .lb-panel { opacity: 1; transform: none; }

/* ---------- Movimento ---------- */
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
@keyframes mark-in { from { opacity: 0; transform: scale(1.12); } to { opacity: 1; transform: none; } }
.view-enter { animation: enter .38s var(--ease) both; }
.panel-enter { animation: enter .28s var(--ease) both; }
.view-enter .stg > *, .panel-enter .stg > * { animation: enter .42s var(--ease) both; }
.stg > *:nth-child(2) { animation-delay: 30ms; } .stg > *:nth-child(3) { animation-delay: 60ms; }
.stg > *:nth-child(4) { animation-delay: 90ms; } .stg > *:nth-child(5) { animation-delay: 120ms; }
.stg > *:nth-child(6) { animation-delay: 150ms; } .stg > *:nth-child(n+7) { animation-delay: 180ms; }
.fade-in { animation: fade .3s var(--ease) both; }
.reveal { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .3s var(--ease), opacity .25s var(--ease); }
.reveal > div { min-height: 0; overflow: hidden; }

@media (min-width: 900px) {
  nav.side { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; scrollbar-width: thin; padding: 2px; margin: -2px; }
}
@media (max-width: 899px) {
  .side-toggle { display: flex; width: 100%; justify-content: space-between; background: var(--surface); min-height: 48px; padding: 0 16px; border-radius: 14px; }
  .side-toggle:hover { background: var(--surface); }
  .side-toggle svg { transition: transform .3s var(--ease); }
  .side-toggle[aria-expanded=true] svg { transform: rotate(180deg); }
  nav.side .reveal.closed { grid-template-rows: 0fr; opacity: 0; visibility: hidden; transition: grid-template-rows .3s var(--ease), opacity .2s var(--ease), visibility 0s .3s; }
  nav.side .reveal > div { padding-top: 14px; }
}
@media (max-width: 640px) {
  .row { grid-template-columns: minmax(0, 1fr) auto; padding: 12px; }
  .row .row-imp { grid-column: 1 / -1; }
  .crit-row { grid-template-columns: 56px minmax(0, 1fr) auto; }
  .crit-row .row-n { display: none; }
  .btn, .btn-ghost, .seg, .nav-i { min-height: 44px; }
  .hide-sm { display: none; }
  .facts2 { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>

<header class="shell top">

      <span><span id="proj" style="font-weight: 600; color: var(--fg)"></span> · Auditoria WCAG 2.2, A e AA</span>
      <span class="chip-q" id="example" hidden>Dados de exemplo</span>

    <button class="btn-ghost" type="button" id="theme" aria-pressed="false" style="flex: none">

      <span class="hide-sm">Tema escuro</span>
    </button>
  </div>
  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 40px; flex-wrap: wrap">
    <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
      <p id="eyebrow" style="font-size: 14px; color: var(--fg-3)"></p>
      <h1 id="title" class="balance" style="font-size: clamp(28px, 3.6vw, 40px); line-height: 1.1; letter-spacing: -0.025em; font-weight: 600"></h1>

  <section class="verdict" id="verdict" aria-labelledby="h-veredito"></section>

<div class="shell body">
  <nav class="side" aria-label="Navegação do relatório">
    <button class="btn side-toggle" type="button" id="side-toggle" aria-expanded="false" aria-controls="side-list">
      <span id="side-current">Seções do relatório</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <div class="reveal" id="side-list"><div><div class="side-inner" id="side"></div></div></div>
  </nav>
  <main id="conteudo" tabindex="-1"></main>
</div>

<footer class="shell" style="padding-bottom: 40px">
  <p id="footer" style="font-size: 13px; color: var(--fg-3)"></p>
</footer>

<dialog class="lb" id="lb" aria-labelledby="lb-titulo">
  <div class="lb-panel">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><h2 id="lb-titulo" style="font-size: 17px; font-weight: 600"></h2><p id="lb-where" style="font-size: 13px; color: var(--fg-3)"></p></div>
      <button class="btn" type="button" id="lb-close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg><span>Fechar</span></button>
    </div>
    <div id="lb-body"></div>
    <p id="lb-desc" style="font-size: 13.5px; color: var(--fg-2)"></p>
  </div>
</dialog>

<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('report-data').textContent);
  var m = D.meta || {};
  var SHOTS = D.shots || {};
  var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Estrutura WCAG 2.2 A e AA (4.1.1 foi removido na 2.2) ----------
  var WCAG = [
    { n: '1', name: 'Perceptível', g: [
      { n: '1.1', name: 'Alternativas em texto', c: [['1.1.1', 'Conteúdo não textual', 'A']] },
      { n: '1.2', name: 'Mídia baseada em tempo', c: [['1.2.1', 'Apenas áudio e apenas vídeo (pré-gravado)', 'A'], ['1.2.2', 'Legendas (pré-gravadas)', 'A'], ['1.2.3', 'Audiodescrição ou mídia alternativa (pré-gravada)', 'A'], ['1.2.4', 'Legendas (ao vivo)', 'AA'], ['1.2.5', 'Audiodescrição (pré-gravada)', 'AA']] },
      { n: '1.3', name: 'Adaptável', c: [['1.3.1', 'Informações e relações', 'A'], ['1.3.2', 'Sequência com significado', 'A'], ['1.3.3', 'Características sensoriais', 'A'], ['1.3.4', 'Orientação', 'AA'], ['1.3.5', 'Identificar o propósito de entrada', 'AA']] },
      { n: '1.4', name: 'Distinguível', c: [['1.4.1', 'Uso de cor', 'A'], ['1.4.2', 'Controle de áudio', 'A'], ['1.4.3', 'Contraste (mínimo)', 'AA'], ['1.4.4', 'Redimensionar texto', 'AA'], ['1.4.5', 'Imagens de texto', 'AA'], ['1.4.10', 'Refluxo', 'AA'], ['1.4.11', 'Contraste não textual', 'AA'], ['1.4.12', 'Espaçamento de texto', 'AA'], ['1.4.13', 'Conteúdo em foco ou ao passar o ponteiro', 'AA']] }] },
    { n: '2', name: 'Operável', g: [
      { n: '2.1', name: 'Acessível por teclado', c: [['2.1.1', 'Teclado', 'A'], ['2.1.2', 'Sem bloqueio do teclado', 'A'], ['2.1.4', 'Atalhos de teclado por caractere', 'A']] },
      { n: '2.2', name: 'Tempo suficiente', c: [['2.2.1', 'Tempo ajustável', 'A'], ['2.2.2', 'Pausar, parar, ocultar', 'A']] },
      { n: '2.3', name: 'Convulsões e reações físicas', c: [['2.3.1', 'Três flashes ou abaixo do limite', 'A']] },
      { n: '2.4', name: 'Navegável', c: [['2.4.1', 'Ignorar blocos', 'A'], ['2.4.2', 'Página com título', 'A'], ['2.4.3', 'Ordem do foco', 'A'], ['2.4.4', 'Finalidade do link (em contexto)', 'A'], ['2.4.5', 'Várias formas', 'AA'], ['2.4.6', 'Cabeçalhos e rótulos', 'AA'], ['2.4.7', 'Foco visível', 'AA'], ['2.4.11', 'Foco não encoberto (mínimo)', 'AA']] },
      { n: '2.5', name: 'Modalidades de entrada', c: [['2.5.1', 'Gestos de ponteiro', 'A'], ['2.5.2', 'Cancelamento de ponteiro', 'A'], ['2.5.3', 'Rótulo no nome', 'A'], ['2.5.4', 'Atuação por movimento', 'A'], ['2.5.7', 'Movimentos de arrastar', 'AA'], ['2.5.8', 'Tamanho do alvo (mínimo)', 'AA']] }] },
    { n: '3', name: 'Compreensível', g: [
      { n: '3.1', name: 'Legível', c: [['3.1.1', 'Idioma da página', 'A'], ['3.1.2', 'Idioma das partes', 'AA']] },
      { n: '3.2', name: 'Previsível', c: [['3.2.1', 'Em foco', 'A'], ['3.2.2', 'Em entrada', 'A'], ['3.2.3', 'Navegação consistente', 'AA'], ['3.2.4', 'Identificação consistente', 'AA'], ['3.2.6', 'Ajuda consistente', 'A']] },
      { n: '3.3', name: 'Assistência de entrada', c: [['3.3.1', 'Identificação de erro', 'A'], ['3.3.2', 'Rótulos ou instruções', 'A'], ['3.3.3', 'Sugestão de erro', 'AA'], ['3.3.4', 'Prevenção de erros (legais, financeiros, de dados)', 'AA'], ['3.3.7', 'Entrada redundante', 'A'], ['3.3.8', 'Autenticação acessível (mínimo)', 'AA']] }] },
    { n: '4', name: 'Robusto', g: [
      { n: '4.1', name: 'Compatível', c: [['4.1.2', 'Nome, função, valor', 'A'], ['4.1.3', 'Mensagens de status', 'AA']] }] }
  ];

  var L = {
    impact: { blocker: 'Bloqueante', high: 'Alto', medium: 'Médio', low: 'Baixo' },
    effort: { S: 'Pequeno', M: 'Médio', L: 'Grande' },
    source: { static: 'Análise de código', runtime: 'Teste automático', review: 'Revisão' },
    status: { fail: 'Falha', pass: 'Passou', na: 'Não se aplica', human: 'Precisa de pessoa', notcov: 'Não coberto' },
    statusPlural: { fail: 'Falham', pass: 'Passaram', na: 'Não se aplicam', human: 'Precisam de pessoa', notcov: 'Não cobertos' },
    method: { tool: 'Ferramenta (axe e árvore de acessibilidade)', agent: 'Agente lendo o código', human: 'Pessoa' },
    methodShort: { tool: 'Ferramenta', agent: 'Agente (código)', human: 'Pessoa' },
    actor: { moderator: 'Moderador', attendee: 'Participante', guest: 'Convidado', variant: 'Celular emulado' },
    layer: { static: 'Análise de código', runtime: 'Teste automático numa reunião real', review: 'Revisão do código' },
    conf: { confirmed: 'Confirmado', likely: 'Provável' },
    fstatus: { persisting: 'Persiste do run anterior', new: 'Novo', regressed: 'Voltou (regressão)', fixed: 'Corrigido' },
    result: { pass: 'Ok', ok: 'Ok', fail: 'Falha', na: 'Não se aplica' },
    pol: { assertive: 'Urgente', polite: 'Educado' }
  };
  var IMP = ['blocker', 'high', 'medium', 'low'];
  var EFF = ['S', 'M', 'L'];
  var ORDER = ['fail', 'notcov', 'human', 'pass', 'na'];

  // ---------- Utilitários ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function fmtDate(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' }) + ', ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso || ''; }
  }
  function shortPath(p) { return (p || '').replace(/^bigbluebutton-html5\/imports\/ui\/components\//, '…/').replace(/^bigbluebutton-html5\/imports\/ui\//, '…/ui/'); }
  function loc(l) { return l.file + (l.line ? ':' + l.line : ''); }
  function normStatus(s) {
    if (s === 'fail') return 'fail';
    if (s === 'pass') return 'pass';
    if (s === 'na' || s === 'n/a' || s === 'inapplicable') return 'na';
    if (s === 'human' || s === 'needs-human') return 'human';
    return 'notcov';
  }
  var ICON = {
    x: '<path d="M7 7l10 10M17 7L7 17"></path>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"></path>',
    wait: '<circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path>',
    dash: '<path d="M6 12h12"></path>',
    right: '<path d="M9 6l6 6-6 6"></path>',
    left: '<path d="M15 6l-6 6 6 6"></path>',
    expand: '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path>',
    search: '<circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>'
  };
  function svg(name, size, sw, extra) {
    return '<svg ' + (extra || '') + ' width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + ICON[name] + '</svg>';
  }
  function statusIcon(tone, size) { return svg(tone === 'fail' ? 'x' : tone === 'pass' ? 'check' : tone === 'human' || tone === 'notcov' ? 'dash' : 'dash', size || 14, 2.8); }

  // ---------- Escopo e dados derivados ----------
  var TOPIC = (m.guidelines && m.guidelines.length) ? m.guidelines : ((m.criteria && m.criteria.length) ? m.criteria : null);
  function inTopic(num) { return !TOPIC || TOPIC.some(function (s) { return num === s || num.indexOf(s + '.') === 0; }); }
  var findingCrits = {};
  (D.findings || []).forEach(function (f) { findingCrits[f.criterion] = true; });

  var crits = [], byNum = {}, principles = [], guideOf = {};
  WCAG.forEach(function (p) {
    var gs = [];
    p.g.forEach(function (g) {
      var cs = g.c.filter(function (c) { return inTopic(c[0]) || findingCrits[c[0]]; });
      if (!cs.length) return;
      gs.push({ n: g.n, name: g.name, crits: cs.map(function (c) { return c[0]; }) });
      cs.forEach(function (c) { var o = { num: c[0], name: c[1], level: c[2], p: p.n, g: g.n }; crits.push(o); byNum[c[0]] = o; guideOf[c[0]] = g; });
    });
    if (gs.length) principles.push({ n: p.n, name: p.name, guidelines: gs });
  });
  // Achados de cláusulas EN 301 549 sem equivalente WCAG.
  var enCrits = [];
  (D.findings || []).forEach(function (f) {
    if (byNum[f.criterion]) return;
    var o = { num: f.criterion, name: f.criterionName || 'Cláusula EN 301 549', level: 'EN', p: 'EN', g: 'EN', en: true };
    crits.push(o); byNum[f.criterion] = o; enCrits.push(f.criterion);
  });
  if (enCrits.length) {
    var enG = { n: 'EN', name: 'Cláusulas sem equivalente WCAG', crits: enCrits };
    principles.push({ n: 'EN', name: 'EN 301 549', guidelines: [enG] });
    enCrits.forEach(function (n) { guideOf[n] = enG; });
  }

  crits.forEach(function (c) {
    var cov = (D.coverage || {})[c.num];
    if (typeof cov === 'string') cov = { status: cov };
    cov = cov || {};
    c.status = c.en ? 'fail' : normStatus(cov.status);
    c.method = cov.method;
    c.how = cov.how || (c.en ? 'Cláusula da EN 301 549 sem critério WCAG correspondente.' : 'Não verificado nesta rodada.');
    c.check = cov.check || '';
    c.checklist = cov.checklist || [];
    c.explored = cov.explored || '';
    c.axe = (D.axeEvidence || {})[c.num] || null;
  });

  var F = (D.findings || []).map(function (f) {
    var o = Object.assign({}, f);
    if (!o.bucket) o.bucket = (o.effort === 'L' || o.external) ? 'backlog' : 'now';
    o.critName = (byNum[o.criterion] || {}).name || o.criterionName || '';
    o.location = o.location || { file: '', line: 0 };
    return o;
  });
  F.sort(function (a, b) {
    return (a.bucket === b.bucket ? 0 : a.bucket === 'now' ? -1 : 1) || IMP.indexOf(a.impact) - IMP.indexOf(b.impact) || EFF.indexOf(a.effort) - EFF.indexOf(b.effort) || a.criterion.localeCompare(b.criterion);
  });
  var byId = {};
  F.forEach(function (f) { byId[f.id] = f; });
  function findingsOf(num) { return F.filter(function (f) { return f.criterion === num; }); }
  var stateIdx = {};
  (D.scenarios || []).forEach(function (s) { s.states.forEach(function (st) { stateIdx[st.key] = { name: st.name, scen: s.name, vp: st.viewport }; }); });

  var nNow = F.filter(function (f) { return f.bucket === 'now'; }).length, nBack = F.length - nNow;

  // ---------- Tópico ----------
  function labelOf(s) {
    for (var i = 0; i < WCAG.length; i++) {
      var p = WCAG[i];
      if (p.n === s) return { kind: 'p', p: p };
      for (var j = 0; j < p.g.length; j++) {
        var g = p.g[j];
        if (g.n === s) return { kind: 'g', p: p, g: g };
        for (var k = 0; k < g.c.length; k++) if (g.c[k][0] === s) return { kind: 'c', p: p, g: g, c: g.c[k] };
      }
    }
    return null;
  }
  var topic;
  if (!TOPIC) topic = { eyebrow: 'Auditoria completa', title: 'Todos os 55 critérios A e AA' };
  else if (TOPIC.length === 1 && labelOf(TOPIC[0])) {
    var t = labelOf(TOPIC[0]);
    topic = t.kind === 'p' ? { eyebrow: 'Auditoria por princípio', title: 'Princípio ' + t.p.n + ': ' + t.p.name }
      : t.kind === 'g' ? { eyebrow: 'Princípio ' + t.p.n + ': ' + t.p.name, title: 'Diretriz ' + t.g.n + ': ' + t.g.name }
      : { eyebrow: 'Diretriz ' + t.g.n + ': ' + t.g.name, title: 'Critério ' + t.c[0] + ': ' + t.c[1] };
  } else topic = { eyebrow: 'Auditoria por tópico', title: TOPIC.join(', ') };
  document.title = topic.title + ' · Auditoria WCAG';

  // ---------- Estado e rotas ----------
  var S = { view: { kind: 'overview', id: null }, from: null, ctab: null, ttab: 'layers', q: '', fb: 'all', fc: 'all', fi: 'all', scen: null, ann: {}, navOpen: false };
  var SLUG = { overview: 'visao-geral', crit: 'criterio', finding: 'achado', list: 'achados', tested: 'testado', manual: 'teste-humano' };
  function hashOf(kind, id) { return '#/' + SLUG[kind] + (id ? '/' + encodeURIComponent(id) : ''); }
  function parseHash() {
    var p = location.hash.replace(/^#\/?/, '').split('/');
    var kind = 'overview';
    Object.keys(SLUG).forEach(function (k) { if (SLUG[k] === p[0]) kind = k; });
    var id = p[1] ? decodeURIComponent(p[1]) : null;
    if (kind === 'crit' && !byNum[id]) kind = 'overview';
    if (kind === 'finding' && !byId[id]) kind = 'overview';
    return { kind: kind, id: kind === 'crit' || kind === 'finding' ? id : null };
  }
  function parseFrom(s) {
    if (!s) return null;
    var p = String(s).split(':');
    return { kind: p[0], id: p[1] || null };
  }
  function fromStr(fr) { return fr ? fr.kind + (fr.id ? ':' + fr.id : '') : ''; }

  function defaultCtab(num) {
    var c = byNum[num];
    if (findingsOf(num).length) return 'achados';
    if (c && c.checklist.length) return 'checklist';
    return 'achados';
  }

  function go(kind, id, opts) {
    opts = opts || {};
    var view = { kind: kind, id: id || null };
    var st = { from: opts.from || null };
    var url = hashOf(kind, id);
    if (opts.replace) history.replaceState(st, '', url);
    else history.pushState(st, '', url);
    route(view, st.from, { anchor: opts.anchor, focus: true });
  }
  function route(view, from, opts) {
    opts = opts || {};
    var changed = view.kind !== S.view.kind || view.id !== S.view.id;
    S.view = view;
    S.from = from;
    if (view.kind === 'crit' && changed) S.ctab = defaultCtab(view.id);
    S.navOpen = false;
    render({ anim: changed || opts.anim ? 'view' : null });
    if (opts.focus) settle(opts.anchor);
  }
  window.addEventListener('popstate', function (e) {
    route(parseHash(), (e.state && e.state.from) || null, { focus: true });
  });

  // Foco e rolagem depois de trocar de visão.
  function settle(anchor) {
    var target = anchor ? $(anchor) : null;
    var heading = $(({ overview: 'h-o-crit', crit: 'h-crit', finding: 'h-achado', list: 'h-lista', tested: 'h-testado', manual: 'h-manual' })[S.view.kind]);
    var focusEl = target || heading;
    if (focusEl) focusEl.focus({ preventScroll: true });
    var scrollEl = target || $('conteudo');
    var top = scrollEl.getBoundingClientRect().top + window.scrollY - 16;
    if (target || window.scrollY > top) window.scrollTo({ top: Math.max(0, top), behavior: REDUCED ? 'auto' : 'smooth' });
  }

  // ---------- Cabeçalho (uma vez) ----------
  $('proj').textContent = m.project || 'BigBlueButton';
  $('example').hidden = !m.example;
  $('eyebrow').textContent = topic.eyebrow;
  $('title').textContent = topic.title;
  var metaRows = [{ label: 'Data', value: fmtDate(m.date) }];
  if (m.branch) metaRows.push({ label: 'Branch', value: m.branch, mono: true });
  if (m.commit) metaRows.push({ label: 'Commit', value: m.commit + (m.dirty ? ' (com alterações)' : ''), mono: true });
  if (m.server && m.server.url) {
    metaRows.push({ label: 'Servidor', value: m.server.url.replace(/^https?:\/\//, ''), mono: true });
    metaRows.push({ label: 'Versão', value: m.server.bbbServerVersion || m.server.html5ClientBuild || 'não informada' });
  }
  $('meta').innerHTML = metaRows.map(function (r) { return '<li><span>' + esc(r.label) + '</span> <span class="v' + (r.mono ? ' mono' : '') + '">' + esc(r.value) + '</span></li>'; }).join('');

  var cnt = { fail: 0, pass: 0, na: 0, human: 0, notcov: 0 };
  crits.forEach(function (c) { if (!c.en) cnt[c.status]++; });
  var total = crits.filter(function (c) { return !c.en; }).length;
  var requiredManual = (D.manualChecks || []).filter(function (x) { return !x.optional; }).length;
  var v;
  if (cnt.fail || enCrits.length) v = { tone: 'fail', label: 'Não conforme', icon: 'x' };
  else if (cnt.notcov) v = { tone: 'notcov', label: 'Incompleto', icon: 'wait' };
  else if (cnt.human || requiredManual) v = { tone: 'human', label: 'Sem falhas, aguardando teste humano', icon: 'wait' };
  else v = { tone: 'pass', label: 'Conforme', icon: 'check' };
  var tw = TOPIC ? ' do tópico' : '';
  v.sentence = cnt.fail
    ? (cnt.fail === total ? (total === 1 ? 'O único critério' + tw + ' falha' : 'Os ' + total + ' critérios' + tw + ' falham') : cnt.fail + ' de ' + total + ' critérios' + tw + ' falham') + '. ' + plural(nNow, 'achado', 'achados') + ' para corrigir nesta fase e ' + nBack + ' no backlog.'
    : enCrits.length ? plural(F.length, 'achado', 'achados') + ' em cláusulas da EN 301 549.'
    : cnt.notcov ? cnt.notcov + ' de ' + total + ' critérios ainda não foram cobertos.'
    : cnt.human ? 'Nenhuma falha. ' + plural(cnt.human, 'critério precisa', 'critérios precisam') + ' de teste com uma pessoa.'
    : 'Todos os critérios' + tw + ' passaram ou não se aplicam.';
  $('verdict').setAttribute('data-tone', v.tone);
  $('verdict').innerHTML =
    '<div style="display: flex; align-items: center; gap: 16px; min-width: 0">' +
      '<span class="verdict-ic">' + svg(v.icon, 24, 2.2) + '</span>' +
      '<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">' +
        '<h2 id="h-veredito" class="label">' + (TOPIC ? 'Veredito do tópico' : 'Veredito') + '</h2>' +
        '<p class="tinted" style="font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em">' + esc(v.label) + '</p>' +

    ((D.notRechecked || []).length ? ', ' + plural(D.notRechecked.length, 'não foi reverificado', 'não foram reverificados') : '') + '. Gerado por /bbb-a11y-audit.';

  // ---------- Tema ----------
  function syncThemeBtn() { $('theme').setAttribute('aria-pressed', String(document.documentElement.getAttribute('data-theme') === 'dark')); }
  syncThemeBtn();
  var themeTimer;
  $('theme').addEventListener('click', function () {
    var root = document.documentElement;
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.classList.add('theming');
    root.setAttribute('data-theme', next);

    syncThemeBtn();

    themeTimer = setTimeout(function () { root.classList.remove('theming'); }, 400);
  });

      try { saved = localStorage.getItem('bbb-a11y-theme'); } catch (err) {}
      if (saved) return;
      document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
      syncThemeBtn();

  // ---------- Peças ----------
  function rowHtml(f, from, opts) {
    opts = opts || {};
    return '<li><button class="row" type="button" data-go="finding" data-id="' + esc(f.id) + '" data-from="' + esc(fromStr(from)) + '" data-k="row-' + esc(f.id) + '">' +
      '<span class="row-imp"><span class="chip" data-tone="' + f.impact + '">' + L.impact[f.impact] + '</span></span>' +
      '<span class="row-main"><span class="row-t">' + esc(f.title) + '</span><span class="row-l">' + (opts.crit ? esc(f.criterion) + ' · ' : '') + esc(shortPath(f.location.file) + (f.location.line ? ':' + f.location.line : '')) + '</span></span>' +
      '<span class="row-end">' + (opts.backlogChip && f.bucket === 'backlog' ? '<span class="chip hide-sm" data-tone="backlog">Backlog</span>' : '') + svg('right', 16, 2, 'class="row-arrow"') + '</span>' +
      '</button></li>';
  }
  function groupCard(head, items) { return '<div class="card list">' + head + '<ul style="list-style: none; display: flex; flex-direction: column">' + items + '</ul></div>'; }

  var keyToF = {};
  F.forEach(function (f) { if (f.key) keyToF[f.key] = f; });
  var KEYS = Object.keys(keyToF).filter(function (k) { return k.length > 3; }).sort(function (a, b) { return b.length - a.length; });

  function critInfo(c) {
    var fs = findingsOf(c.num), fNow = fs.filter(function (f) { return f.bucket === 'now'; }).length;
    var ck = c.checklist.map(function (k) {
      var refs = [], ev = k.evidence || '';
      KEYS.forEach(function (key) {
        if (ev.indexOf(key) >= 0) { var f = keyToF[key]; refs.push(f); ev = ev.split(key).join(f.id); }
      });
      var r = k.result === 'ok' ? 'pass' : k.result;
      return { label: k.label || k.text, evidence: ev, tone: r === 'pass' ? 'pass' : r === 'fail' ? 'fail' : r === 'na' ? 'na' : 'notcov', resultLabel: L.result[k.result] || 'Sem resposta', refs: refs };
    });
    var ckPass = ck.filter(function (x) { return x.tone === 'pass'; }).length, ckFail = ck.filter(function (x) { return x.tone === 'fail'; }).length, ckNa = ck.length - ckPass - ckFail;
    return {
      c: c, fs: fs, ck: ck,
      methodLabel: L.method[c.method] || 'Não verificado',
      methodShort: L.methodShort[c.method] || '—',
      findingsLabel: fs.length ? fs.length + ' · ' + fNow + ' nesta fase, ' + (fs.length - fNow) + ' no backlog' : 'Nenhum',
      checklistLabel: ck.length ? [ckPass ? ckPass + ' ok' : '', ckFail ? ckFail + ' com falha' : '', ckNa ? ckNa + ' n/a' : ''].filter(Boolean).join(', ') + ' de ' + ck.length : 'Sem checklist'
    };
  }
  function guideStatus(g) {
    var n = { fail: 0, notcov: 0, human: 0 };
    g.crits.forEach(function (num) { var s = byNum[num].status; if (n[s] !== undefined) n[s]++; });
    return n.fail ? { tone: 'fail', label: plural(n.fail, 'critério com falha', 'critérios com falha') }
      : n.notcov ? { tone: 'notcov', label: 'Incompleta' } : n.human ? { tone: 'human', label: 'Aguardando pessoa' } : { tone: 'pass', label: 'Concluída' };
  }

  // ---------- Navegação lateral ----------
  function renderNav() {

    function item(o) {

        (o.tone ? '<span class="ico" data-tone="' + o.tone + '">' + statusIcon(o.tone) + '</span>' : '') +
        '<span style="display: flex; flex-direction: column; min-width: 0"><span>' + (o.num ? '<span class="mono" style="font-size: 12.5px; color: var(--fg-3)">' + esc(o.num) + ' </span>' : '') + esc(o.label) + '</span></span>' +
        (o.count !== undefined && o.count !== '' ? '<span class="nav-n">' + esc(o.count) + '</span>' : '') +
        (o.sr ? '<span class="sr">' + esc(o.sr) + '</span>' : '') +
        '</button></li>';
    }
    function group(label, items) { return '<div class="side-group"><h2 class="label" style="padding: 0 10px 4px">' + esc(label) + '</h2><ul>' + items.map(item).join('') + '</ul></div>'; }
    var html = group('Relatório', [
      { label: 'Visão geral', go: 'overview', current: view.kind === 'overview' },
      { label: 'Todos os achados', go: 'list', count: F.length, current: view.kind === 'list' }
    ]);
    principles.forEach(function (p) {
      var items = [];
      p.guidelines.forEach(function (g) {
        if (g.n !== 'EN') items.push({ num: g.n, label: g.name, go: 'overview', anchor: 'g-' + g.n, lvl: 2 });
        g.crits.forEach(function (num) {
          var c = byNum[num], fl = findingsOf(num).length;
          items.push({ num: num, label: c.name, go: 'crit', id: num, lvl: g.n === 'EN' ? 2 : 3, count: fl || '', tone: c.status,
            sr: '. Situação: ' + L.status[c.status] + (fl ? ', ' + plural(fl, 'achado', 'achados') : ''),

        });
      });
      html += group(p.n === 'EN' ? p.name : 'Princípio ' + p.n + ': ' + p.name, items);
    });
    html += group('Cobertura', [
      { label: 'O que foi testado', go: 'tested', count: plural((D.scenarios || []).length, 'cenário', 'cenários'), current: view.kind === 'tested' },
      { label: 'Teste humano', go: 'manual', count: (D.manualChecks || []).length, current: view.kind === 'manual' }
    ]);
    $('side').innerHTML = html;
    var names = { overview: 'Visão geral', list: 'Todos os achados', tested: 'O que foi testado', manual: 'Teste humano' };
    $('side-current').textContent = view.kind === 'crit' ? view.id + ' ' + byNum[view.id].name
      : view.kind === 'finding' ? 'Achado ' + view.id : names[view.kind];
    $('side-toggle').setAttribute('aria-expanded', String(S.navOpen));
    $('side-list').classList.toggle('closed', !S.navOpen);
  }
  $('side-toggle').addEventListener('click', function () {

  // ---------- Visão geral ----------
  function viewOverview() {
    var compact = crits.length > 8;

    html += '<section class="sec" aria-labelledby="h-o-crit"><div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap">' +
      '<h2 id="h-o-crit" tabindex="-1" class="h2">' + (TOPIC ? 'Critérios do tópico' : 'Critérios') + '</h2></div>';
    principles.forEach(function (p) {
      p.guidelines.forEach(function (g) {
        var gs = guideStatus(g);
        var head = '<div id="g-' + esc(g.n) + '" tabindex="-1" style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; ' + (compact ? 'padding: 12px 16px 8px' : 'margin-top: 6px') + '">' +
          '<h3 style="display: flex; align-items: baseline; gap: 10px; font-size: ' + (compact ? '14.5' : '16') + 'px; font-weight: 600">' + (g.n !== 'EN' ? '<span class="mono" style="font-weight: 500; color: var(--fg-3)">' + esc(g.n) + '</span>' : '') + '<span>' + esc(g.name) + '</span></h3>' +
          '<span class="chip" data-tone="' + gs.tone + '">' + (g.n !== 'EN' ? 'Diretriz ' + esc(g.n) + ': ' : '') + esc(gs.label) + '</span></div>';
        if (compact) {
          html += '<div class="card list">' + head + '<ul style="list-style: none; display: flex; flex-direction: column">' + g.crits.map(function (num) {
            var c = byNum[num], fl = findingsOf(num).length;

              '<span class="mono" style="font-size: 13px; color: var(--fg-2)">' + esc(num) + '</span>' +
              '<span class="row-main"><span class="row-t">' + esc(c.name) + ' <span class="mono muted" style="font-size: 11.5px; font-weight: 400">' + esc(c.level) + '</span></span></span>' +

                '<span style="display: flex; align-items: center; gap: 8px"><span class="mono" style="font-size: 13.5px; color: var(--fg-2)">' + esc(c.num) + '</span><span class="chip-q">' + (c.en ? 'EN 301 549' : 'Nível ' + esc(c.level)) + '</span></span>' +
                '<span class="chip" data-tone="' + c.status + '">' + L.status[c.status] + '</span></div>' +
              '<h4 style="font-size: 18px; font-weight: 600; letter-spacing: -0.01em">' + esc(c.name) + '</h4>' +
              '<dl>' +
                '<div><dt>Quem verificou</dt><dd>' + esc(ci.methodShort) + '</dd></div>' +
                '<div><dt>Checklist</dt><dd class="tnum">' + esc(ci.checklistLabel) + '</dd></div>' +
                '<div><dt>Achados</dt><dd class="tnum">' + esc(ci.findingsLabel) + '</dd></div>' +
              '</dl>' +
              '<div style="margin-top: auto"><button class="btn" type="button" data-go="crit" data-id="' + esc(c.num) + '" data-k="cc-' + esc(c.num) + '" style="width: 100%">Abrir critério e prova</button></div>' +
              '</li>';
          }).join('') + '</ul>';
        }
      });
    });
    if (crits.some(function (c) { return c.g === '4.1'; })) html += '<p style="font-size: 13px; color: var(--fg-3)">O critério 4.1.1 (Análise) foi removido na WCAG 2.2 e não entra na contagem.</p>';
    html += '</section>';

    // Corrigir nesta fase, por critério
    var nowGroups = crits.map(function (c) {
      var items = F.filter(function (f) { return f.criterion === c.num && f.bucket === 'now'; });
      return items.length ? groupCard('<h3 class="grp-h"><span class="mono">' + esc(c.num) + '</span><span>' + esc(c.name) + '</span><span class="tnum">' + items.length + '</span></h3>', items.map(function (f) { return rowHtml(f, { kind: 'overview' }); }).join('')) : '';

      '<p class="lead">Sem prioridade: tudo ' + (TOPIC ? 'do tópico' : 'da auditoria') + ' é corrigido nesta fase. O impacto só indica quem é mais afetado.</p></div>' +
      (nowGroups ? '<div class="sec stg">' + nowGroups + '</div>' : '<p class="empty">Nada para corrigir nesta fase.</p>') + '</section>';

    // Backlog, por motivo
    var reasons = {}, order = [];
    F.filter(function (f) { return f.bucket === 'backlog'; }).forEach(function (f) {
      var r = f.backlogReason || 'Motivo não informado.';
      if (!reasons[r]) { reasons[r] = []; order.push(r); }
      reasons[r].push(f);

      }).join('') + '</div>' : '<p class="empty" style="color: var(--fg-3)">Nada no backlog.</p>') + '</section>';

  }

  // ---------- Critério ----------
  function viewCrit() {

      .sort(function (a, b) { return b.failed - a.failed || a.id.localeCompare(b.id); }) : [];
    var from = { kind: 'crit', id: c.num };
    var tabs = [{ k: 'achados', label: 'Achados', n: ci.fs.length }, { k: 'checklist', label: 'Checklist', n: ci.ck.length }, { k: 'axe', label: 'Regras axe', n: axe.length }];
    if (c.explored) tabs.push({ k: 'explorado', label: 'Explorado além do checklist' });

        '<h2 id="h-crit" tabindex="-1" style="font-size: clamp(24px, 2.6vw, 30px); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15">' + esc(c.name) + '</h2>' +

          '<div class="kv"><dt>Quem verificou</dt><dd>' + esc(ci.methodLabel) + '</dd></div>' +
          '<div class="kv"><dt>Achados</dt><dd class="tnum">' + esc(ci.findingsLabel) + '</dd></div>' +
          '<div class="kv"><dt>Checklist</dt><dd class="tnum">' + esc(ci.checklistLabel) + '</dd></div>' +
          '<div class="kv wide"><dt>Como foi verificado</dt><dd class="pretty" style="font-size: 14.5px; font-weight: 400; color: var(--fg-2)">' + esc(c.how) + (c.status === 'human' && c.check ? ' Roteiro: ' + esc(c.check) + '.' : '') + '</dd></div>' +

      });

          '<div style="overflow-x: auto; border-radius: 18px; background: var(--surface); padding: 6px 6px 2px"><table>' +

  // ---------- Lista ----------
  function listMatch(f) {
    if (S.fb !== 'all' && f.bucket !== S.fb) return false;

    return q.split(/\s+/).every(function (t) { return hay.indexOf(t) >= 0; });

            '<span style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px"><span class="chip sm" data-tone="' + (st.ok ? 'pass' : 'fail') + '">' + (st.ok ? 'Auditada' : 'Não abriu') + '</span>' +
              '<span class="chip-q sm tnum">' + (st.ok ? plural(st.violations, 'violação axe', 'violações axe') : '—') + '</span>' +
              ((Sc.actors || []).length > 1 && st.actor ? '<span class="chip-q sm">' + esc(L.actor[st.actor] || st.actor) + '</span>' : '') + '</span>' +
            (!st.ok && st.error ? '<span class="mono wrap-any" style="font-size: 12px; color: var(--fail)">' + esc(String(st.error).slice(0, 200)) + '</span>' : '') +
          '</div></li>';
      }).join('') + '</ul></div>';

    // Anúncios
    var anns = Sc.announcements || [];
    html += '<div style="display: flex; flex-direction: column; gap: 12px"><div style="display: flex; flex-direction: column; gap: 4px">' +
      '<h4 style="font-size: 15px; font-weight: 600">O que um leitor de tela teria anunciado</h4>' +
      '<p style="font-size: 13px; color: var(--fg-3); max-width: 80ch">Mensagens iguais no mesmo instante foram agrupadas; “3 regiões” quer dizer que a mesma mensagem chegou ao leitor de tela três vezes.</p></div>';
    if (!anns.length) html += '<p style="font-size: 14px; color: var(--fg-3); padding: 16px; border-radius: 14px; background: var(--surface-2)">Este cenário não grava anúncios.</p>';
    else {
      var t0 = anns[0].t || 0, moments = [];
      anns.forEach(function (a) {
        var mo = moments[moments.length - 1];
        if (!mo || mo.actor !== a.actor) { mo = { actor: a.actor || '', raw: [] }; moments.push(mo); }
        var prev = mo.raw[mo.raw.length - 1];
        if (prev && !a.none && !prev.none && prev.t === a.t && prev.text === a.text) { prev.count++; prev.regions.push(a.region); if (a.politeness === 'assertive') prev.pol = 'assertive'; if (a.regionCreatedWithMessage) prev.late = true; }
        else mo.raw.push({ t: a.t, text: a.text, none: !!a.none, count: 1, regions: [a.region], pol: a.politeness, late: !!a.regionCreatedWithMessage });
      });
      var LIMIT = 8;
      html += '<ol style="list-style: none; display: flex; flex-direction: column; gap: 16px">' + moments.map(function (mo, i) {
        var key = Sc.id + ':' + i, expanded = !!S.ann[key], can = mo.raw.length > LIMIT;
        var list = can && !expanded ? mo.raw.slice(0, LIMIT) : mo.raw;
        var label = mo.actor.indexOf(':') > 0 ? mo.actor.charAt(0).toUpperCase() + mo.actor.slice(1).replace(':', ' —') : 'Percurso do ' + (L.actor[mo.actor] || mo.actor).toLowerCase();
        return '<li style="display: flex; flex-direction: column; gap: 8px"><p style="font-size: 13.5px; font-weight: 600">' + esc(label) + '</p>' +
          '<ol style="list-style: none; display: flex; flex-direction: column; border-radius: 14px; background: var(--surface-2); padding: 4px">' + list.map(function (a, k) {
            var sec = Math.max(0, Math.round(((a.t || 0) - t0) / 1000));
            var invisible = !a.none && String(a.text || '').replace(/[​-‍﻿\s]/g, '') === '';
            var regions = (a.count > 1 ? a.regions.join('  ·  ') : a.regions[0]) || '';
            return '<li class="' + (k >= LIMIT ? 'fade-in' : '') + '" style="display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 9px 12px">' +
              '<span class="mono tnum" style="font-size: 12px; color: var(--fg-3)">+' + Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0') + '</span>' +
              '<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">' +
                (a.none ? '<span style="font-size: 14px; font-style: italic; color: var(--fg-3)">Nada foi anunciado</span>'
                  : '<span class="wrap-any" style="font-size: 14px">“' + esc(invisible ? '(caractere invisível)' : a.text) + '”</span><span class="mono wrap-any" style="font-size: 11.5px; color: var(--fg-3)">' + esc(regions) + (a.late ? ' · região criada junto com a mensagem (pode não ser lida)' : '') + '</span>') +
              '</span>' +
              '<span style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end">' +
                (a.count > 1 ? '<span class="chip sm" data-tone="high">' + a.count + ' regiões</span>' : '') +
                (!a.none ? '<span class="chip-q sm" style="background: var(--surface)">' + esc(L.pol[a.pol] || a.pol || '') + '</span>' : '') +
              '</span></li>';
          }).join('') + '</ol>' +
          (can ? '<div><button class="btn-ghost" type="button" aria-expanded="' + expanded + '" data-ann="' + esc(key) + '" data-k="ann-' + esc(key) + '">' + (expanded ? 'Mostrar menos' : 'Mostrar os ' + mo.raw.length + ' anúncios') + '</button></div>' : '') +
          '</li>';
      }).join('') + '</ol>';
    }
    return html + '</div></div></div>';
  }

  // ---------- Teste humano ----------
  function viewManual() {
    var mcs = D.manualChecks || [];
    var req = mcs.filter(function (x) { return !x.optional; }), opc = mcs.filter(function (x) { return x.optional; });
    var groups = [
      { title: 'Obrigatórios', items: req, empty: 'Nenhum roteiro obrigatório nesta rodada: nenhum critério depende de uma pessoa para fechar o resultado.' },
      { title: 'Opcionais', items: opc, empty: 'Nenhuma confirmação opcional.' }
    ];
    return '<section aria-labelledby="h-manual" style="display: flex; flex-direction: column; gap: 28px">' +
      '<div style="display: flex; flex-direction: column; gap: 6px"><h2 id="h-manual" tabindex="-1" class="h2-lg">Teste humano</h2>' +
      '<p style="font-size: 14.5px; color: var(--fg-2); max-width: 72ch">Roteiros para uma pessoa executar com leitor de tela. Os obrigatórios decidem o resultado; os opcionais são confirmações extras que não o mudam.</p></div>' +
      groups.map(function (g) {
        return '<div style="display: flex; flex-direction: column; gap: 12px"><div style="display: flex; align-items: baseline; gap: 10px"><h3 style="font-size: 18px; font-weight: 600">' + g.title + '</h3><span class="tnum" style="font-size: 14px; color: var(--fg-3)">' + g.items.length + '</span></div>' +
          (g.items.length ? '<ul class="grid-auto stg" style="--min: 360px; list-style: none">' + g.items.map(function (mc) {
            return '<li class="card pad" style="display: flex; flex-direction: column; gap: 16px">' +
              '<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap"><h4 style="font-size: 16.5px; font-weight: 600">' + esc(mc.flow) + '</h4>' + (mc.tool ? '<span class="chip-q">' + esc(mc.tool) + '</span>' : '') + '</div>' +
              '<ol style="display: flex; flex-direction: column; gap: 8px; padding-left: 22px; font-size: 14.5px; color: var(--fg-2)">' + (mc.steps || []).map(function (s) { return '<li style="padding-left: 4px">' + esc(s) + '</li>'; }).join('') + '</ol>' +
              '<div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 12px; background: var(--surface-2)"><p class="label">Resultado esperado</p><p class="pretty" style="font-size: 14.5px">' + esc(mc.expect) + '</p></div>' +
              '</li>';
          }).join('') + '</ul>' : '<p class="empty">' + g.empty + '</p>') + '</div>';
      }).join('') + '</section>';
  }

  // ---------- Render ----------
  function crumbsHtml() {
    var view = S.view, cr = [];
    var home = { label: 'Visão geral', go: 'overview' };
    if (view.kind === 'crit') cr = [home, { label: view.id + ' ' + byNum[view.id].name }];
    if (view.kind === 'finding') {
      var f = byId[view.id], from = S.from || { kind: 'crit', id: f.criterion };
      cr = from.kind === 'list' ? [home, { label: 'Todos os achados', go: 'list' }, { label: f.id }]
        : [home, { label: f.criterion + ' ' + f.critName, go: 'crit', id: f.criterion }, { label: f.id }];
    }
    if (!cr.length) return '';
    return '<nav aria-label="Você está em" style="display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px">' + cr.map(function (c) {
      return c.go ? '<button class="crumb" type="button" data-go="' + c.go + '"' + (c.id ? ' data-id="' + esc(c.id) + '"' : '') + '>' + esc(c.label) + '</button><span aria-hidden="true" style="color: var(--fg-3); font-size: 13px">/</span>'
        : '<span aria-current="page" style="font-size: 13.5px; color: var(--fg-2); padding: 4px 2px">' + esc(c.label) + '</span>';
    }).join('') + '</nav>';
  }
  function replay(el, cls) {
    if (REDUCED || !el) return;
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }
  function restoreFocus(key) {
    if (!key) return;
    var el = document.querySelector('[data-k="' + (window.CSS && CSS.escape ? CSS.escape(key) : key) + '"]');
    if (el && !el.disabled) el.focus({ preventScroll: true });
  }
  function render(opts) {
    opts = opts || {};
    var key = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
    renderNav();
    var k = S.view.kind;
    var body = k === 'crit' ? viewCrit() : k === 'finding' ? viewFinding() : k === 'list' ? viewList() : k === 'tested' ? viewTested() : k === 'manual' ? viewManual() : viewOverview();
    var main = $('conteudo');
    main.innerHTML = crumbsHtml() + '<div class="view">' + body + '</div>';
    if (opts.anim === 'view') replay(main.querySelector('.view'), 'view-enter');
    else if (opts.anim === 'panel') replay($('panel'), 'panel-enter');
    else if (opts.anim === 'scen') replay(main.querySelector('.scen-body'), 'panel-enter');
    if (!opts.anim || opts.anim !== 'view') restoreFocus(key);
  }

  // ---------- Eventos ----------
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t || t.disabled) return;
    var d = t.dataset;
    if (d.go) {
      e.preventDefault();
      var from = d.from ? parseFrom(d.from) : null;
      if (d.go === S.view.kind && (d.id || null) === S.view.id && !d.anchor) { settle(); return; }
      go(d.go, d.id, { from: from, anchor: d.anchor });
      return;
    }
    if (d.set) {
      var cur = S[d.set];
      S[d.set] = d.val;
      if (d.set === 'fb' || d.set === 'fc' || d.set === 'fi') { updateList(cur !== d.val); return; }
      if (cur === d.val) return;
      render({ anim: d.set === 'scen' ? 'scen' : 'panel' });
      return;
    }
    if (d.clear) {
      S.q = ''; S.fb = 'all'; S.fc = 'all'; S.fi = 'all';
      $('busca').value = '';
      updateList(true);
      $('busca').focus();
      return;
    }
    if (d.step) {
      var f = byId[S.view.id], ctx = findingCtx(f), i = ctx.indexOf(f) + Number(d.step);
      if (ctx[i]) {
        history.replaceState({ from: S.from }, '', hashOf('finding', ctx[i].id));
        S.view = { kind: 'finding', id: ctx[i].id };
        render({ anim: 'view' });
        restoreFocus(d.k);
        if (!document.activeElement || document.activeElement === document.body) $('h-achado').focus({ preventScroll: true });
      }
      return;
    }
    if (d.ann) {
      S.ann[d.ann] = !S.ann[d.ann];
      render();
      return;
    }
    if (d.lb !== undefined) {
      var fd = byId[S.view.id], s = fd.evidenceShots[+d.lb], si = shotInfo(s);
      openLb(t, si.caption, si.where, frameHtml(SHOTS[s.shot], si.vp, s.boxes, true), fd.id + ' · ' + fd.title);
      return;
    }
    if (d.lbs) {
      var info = stateIdx[d.lbs] || {};
      openLb(t, info.name || d.lbs, info.scen || '', frameHtml(SHOTS[d.lbs], info.vp || { width: 1366, height: 768 }, [], true), '');
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'busca') { S.q = e.target.value; updateList(false); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'fc') { S.fc = e.target.value; updateList(true); }
  });

  // ---------- Diálogo do print ----------
  var lb = $('lb'), lbBack = null, lbTimer;
  function openLb(opener, title, where, frame, desc) {
    lbBack = opener;
    $('lb-titulo').textContent = title;
    $('lb-where').textContent = where;
    $('lb-body').innerHTML = frame;
    $('lb-desc').textContent = desc;
    $('lb-desc').hidden = !desc;
    clearTimeout(lbTimer);
    lb.showModal();
    requestAnimationFrame(function () { requestAnimationFrame(function () { lb.classList.add('open'); }); });
    $('lb-close').focus();
  }
  function closeLb() {
    if (!lb.open) return;
    lb.classList.remove('open');
    lbTimer = setTimeout(function () {
      lb.close();
      if (lbBack && document.contains(lbBack)) lbBack.focus({ preventScroll: true });
    }, REDUCED ? 0 : 220);
  }
  $('lb-close').addEventListener('click', closeLb);
  lb.addEventListener('cancel', function (e) { e.preventDefault(); closeLb(); });
  lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });

  // ---------- Início ----------
  var start = parseHash();
  var st0 = history.state && history.state.from ? history.state.from : null;
  history.replaceState({ from: st0 }, '', hashOf(start.kind, start.id));
  S.view = start;
  S.from = st0;
  if (start.kind === 'crit') S.ctab = defaultCtab(start.id);
  render({ anim: 'view' });
})();
</script>
</body>
</html>
